# 휴대폰만으로 배포하기 위한 설정 파일.
# render.com 에서 이 저장소를 고르면 아래 내용을 그대로 읽어 서버를 띄운다.
# 터미널도, 설치도 필요 없다.
services:
  - type: web
    name: gym-place-check
    runtime: node
    plan: free
    buildCommand: ""        # 의존성이 없어서 설치할 것이 없다
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # 인터넷에 열려 있으므로 접근 키를 반드시 둔다.
      # generateValue 는 렌더가 무작위로 만들어 주고, 대시보드에서 값을 볼 수 있다.
      #
      # 이 값은 "처음 만들 때 한 번"만 생기고 그 뒤로는 배포해도 바뀌지 않는다.
      # 배포할 때마다 잠기는 일이 있었다면 그건 이 변수가 아직 없던 시절 이야기다
      # (환경변수가 없으면 서버가 켜질 때마다 새 키를 만든다 - server.js 의 accessKey 참고).
      # /api/health 의 keySource 가 "env" 면 지금은 안전한 상태다.
      #
      # 외우기 쉬운 값으로 바꾸고 싶으면 대시보드에서 그냥 덮어쓰면 된다.
      # 덮어쓴 값도 렌더가 다시 만들어 내지 않는다.
      - key: ACCESS_KEY
        generateValue: true
      # AI 문장 생성을 쓰려면 대시보드에서 직접 넣는다. 안 넣으면 그 기능만 꺼진다.
      - key: ANTHROPIC_API_KEY
        sync: false
